<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d252b">
  <meta name="referrer" content="no-referrer">
  <title>LabScan by Rourog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=11.0">
</head>
<body>
  <main class="app">
    <header class="brand-banner" aria-label="LabScan">
      <div class="brand-mark" aria-hidden="true">
        <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2M7 7h10v10H7zM9 10h6M9 13h6"/></svg>
      </div>
      <h1>LabScan</h1>
      <p class="brand-byline">by Rourog</p>
      <span class="brand-version">v11.0</span>
    </header>

    <!-- Escritorio: URL sin ?session= -->
    <section id="desktopView" class="view" hidden>
      <div class="desktop-grid">
        <article class="panel pairing-panel">
          <div class="panel-heading centered-heading">
            <svg class="ui-icon panel-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="4" width="13" height="10" rx="1.5"/><path d="M7 18h4M9 14v4"/><rect x="17" y="7" width="4.5" height="11" rx="1"/></svg>
            <div>
              <h2>Vincular teléfono</h2>
              <p>Escanea el código para iniciar una sesión.</p>
            </div>
          </div>

          <div class="qr-frame">
            <div id="qrCode" class="qr" aria-label="Código QR para vincular el teléfono"></div>
          </div>

          <div class="pair-meta">
            <div id="desktopPairCode" class="pair-code" hidden></div>
            <p id="desktopStatus" class="status">Creando sesión…</p>
          </div>
        </article>

        <article class="panel results-panel">
          <div class="results-header">
            <div class="panel-heading">
              <svg class="ui-icon panel-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3.5h6M12 8v6M9 11h6M8.5 17h7"/></svg>
              <div>
                <h2>Resultados</h2>
                <p>Formato listo para copiar a la nota.</p>
              </div>
            </div>

            <button id="copyDesktopButton" class="icon-button copy-button" type="button" disabled>
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h2"/></svg>
              <span>Copiar</span>
            </button>
          </div>

          <div class="format-toolbar" aria-label="Opciones de formato">
            <div class="format-group">
              <span class="format-label">Vista</span>
              <div class="segmented-control" role="group" aria-label="Vista de resultados">
                <button id="compactModeButton" class="segment is-active" type="button" aria-pressed="true">Reducida</button>
                <button id="expandedModeButton" class="segment" type="button" aria-pressed="false">Expandida</button>
              </div>
            </div>

            <button id="abbreviationsToggle" class="format-chip is-active" type="button" aria-pressed="true">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 8h14M5 12h10M5 16h7"/></svg>
              Abreviaturas
            </button>

            <button id="uppercaseToggle" class="format-chip" type="button" aria-pressed="false">
              <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h9M9.5 6v12M6.5 18h6M16 10h4M18 10v8M16.5 18h3"/></svg>
              MAYÚSCULAS
            </button>
          </div>

          <textarea
            id="desktopOutput"
            class="results-output"
            aria-label="Datos recibidos del teléfono"
            placeholder="Los datos procesados en el teléfono aparecerán aquí."
            spellcheck="false"
            readonly
          ></textarea>
        </article>
      </div>
    </section>

    <!-- Móvil: URL abierta desde el QR -->
    <section id="mobileView" class="view mobile-view" hidden>
      <article class="panel mobile-panel">
        <div class="mobile-link-status">
          <div id="mobilePairCode" class="pair-code pair-code-mobile" hidden></div>
          <p id="mobileStatus" class="status mobile-status">Vinculando con el PC…</p>
        </div>

        <div class="actions">
          <button id="cameraButton" class="action-button" type="button">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6l1.5-2h5L16 6h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z"/><circle cx="12" cy="12.5" r="3.2"/></svg>
            <span>Tomar una foto</span>
          </button>
          <button id="uploadButton" class="action-button" type="button">
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h7l4 4v14H7zM14 3v5h5M12 17v-6M9.5 13.5L12 11l2.5 2.5"/></svg>
            <span>Subir archivo</span>
          </button>
          <button id="analyzeButton" class="action-button primary-action" type="button" disabled>
            <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3H5a2 2 0 0 0-2 2v2M17 3h2a2 2 0 0 1 2 2v2M7 21H5a2 2 0 0 1-2-2v-2M17 21h2a2 2 0 0 0 2-2v-2M7 7h10v10H7zM9 10h6M9 13h6"/></svg>
            <span id="analyzeButtonLabel">Analizar datos</span>
          </button>
        </div>

        <input id="cameraInput" class="file-input" type="file" accept="image/*" capture="environment">
        <input id="uploadInput" class="file-input" type="file" accept="image/*" multiple>

        <textarea
          id="output"
          class="mobile-output"
          aria-label="Datos procesados"
          placeholder="Los datos procesados aparecerán aquí."
          spellcheck="false"
        ></textarea>
      </article>
    </section>

    <section id="configView" class="view config-error panel" hidden>
      <svg class="ui-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 17H3zM12 9v5M12 17h.01"/></svg>
      <div>
        <strong>Firebase no está configurado.</strong>
        <p>Revisa <code>firebase-config.js</code>.</p>
      </div>
    </section>
  </main>

  <!-- El QR se genera localmente. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="lab-parser.js?v=11.0"></script>
  <script src="app.js?v=11.0"></script>
  <script type="module" src="firebase-sync.js?v=11.0"></script>
</body>
</html>
