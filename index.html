<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="referrer" content="no-referrer">
  <title>LabScan by Rourog</title>
  <link rel="stylesheet" href="styles.css?v=9.1">
</head>
<body>
  <main class="app">
    <h1>LabScan <span>by Rourog</span></h1>

    <!-- Escritorio: se muestra cuando la URL NO contiene ?session= -->
    <section id="desktopView" class="view" hidden>
      <div class="pairing">
        <div id="qrCode" class="qr" aria-label="Código QR para vincular el teléfono"></div>
        <div id="desktopPairCode" class="pair-code" hidden></div>
        <p id="desktopStatus" class="status">Creando sesión…</p>
      </div>

      <textarea
        id="desktopOutput"
        aria-label="Datos recibidos del teléfono"
        placeholder="Los datos procesados en el teléfono aparecerán aquí."
        spellcheck="false"
        readonly
      ></textarea>

      <button id="copyDesktopButton" class="secondary-button" type="button" disabled>Copiar</button>
    </section>

    <!-- Móvil: se muestra al abrir el QR con ?session= -->
    <section id="mobileView" class="view" hidden>
      <div id="mobilePairCode" class="pair-code pair-code-mobile" hidden></div>
      <p id="mobileStatus" class="status mobile-status">Vinculando con el PC…</p>

      <div class="actions">
        <button id="cameraButton" type="button">Tomar una foto</button>
        <button id="uploadButton" type="button">Subir archivo</button>
        <button id="analyzeButton" type="button" disabled>Analizar datos</button>
      </div>

      <input id="cameraInput" class="file-input" type="file" accept="image/*" capture="environment">
      <input id="uploadInput" class="file-input" type="file" accept="image/*" multiple>

      <textarea
        id="output"
        aria-label="Datos procesados"
        placeholder="Los datos procesados aparecerán aquí."
        spellcheck="false"
      ></textarea>
    </section>

    <section id="configView" class="view config-error" hidden>
      <p>Firebase todavía no está configurado.</p>
      <p>Edita <code>firebase-config.js</code> con los datos de tu aplicación web de Firebase.</p>
    </section>
  </main>

  <!-- QRCode.js: solo genera el QR localmente; no envía la URL a terceros. -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="lab-parser.js?v=9.1"></script>
  <script src="app.js?v=9.1"></script>
  <script type="module" src="firebase-sync.js?v=9.1"></script>
</body>
</html>
